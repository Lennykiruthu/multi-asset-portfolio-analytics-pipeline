# dagster.yaml
# ---------------------------------------------------------------------------
# Dagster instance configuration.
# Place this file in your DAGSTER_HOME directory.
#
# DAGSTER_HOME should be set in your .env:
#   DAGSTER_HOME=/storage/local-git-repos/multi-asset-portfolio-analytics-pipeline/dagster_home
#
# Dagster reads this file on startup (both webserver and daemon).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Run storage — where Dagster persists run history, logs, and asset metadata.
#
# Option A (default, zero config): SQLite stored inside DAGSTER_HOME.
#   Good for local development. Comment out the entire run_storage block
#   to use this option.
#
# Option B (recommended for Docker / production): Postgres.
#   Uses the same Postgres container you already have.
#   Uncomment the block below and it will share your portfolio_postgres
#   container (a separate dagster schema is created automatically).
# ---------------------------------------------------------------------------

# -- Uncomment to use Postgres for Dagster's own storage (recommended for Docker):
#
# run_storage:
#   module: dagster_postgres.run_storage
#   class: PostgresRunStorage
#   config:
#     postgres_url:
#       env: DATABASE_URL
#
# event_log_storage:
#   module: dagster_postgres.event_log
#   class: PostgresEventLogStorage
#   config:
#     postgres_url:
#       env: DATABASE_URL
#
# schedule_storage:
#   module: dagster_postgres.schedule_storage
#   class: PostgresScheduleStorage
#   config:
#     postgres_url:
#       env: DATABASE_URL

# ---------------------------------------------------------------------------
# Compute logs — where stdout/stderr from asset runs is stored.
# Defaults to local files in DAGSTER_HOME/storage. Fine for local dev.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Sensor / schedule daemon config
# ---------------------------------------------------------------------------

sensors:
  use_threads: true
  num_workers: 4

schedules:
  use_threads: true
  num_workers: 4

# ---------------------------------------------------------------------------
# Telemetry — disable if you prefer not to send anonymous usage stats
# ---------------------------------------------------------------------------
telemetry:
  enabled: false
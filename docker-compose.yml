services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: portfolio_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: portfolio_dbt
    volumes:
      - ./portfolio_analytics:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy            # waits for healthcheck to pass, not just container start
    env_file:
      - .env
    command: build --profiles-dir /usr/app/dbt  # default dbt command; override per need

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: portfolio_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./superset_home:/app/superset_home
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
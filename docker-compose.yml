services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared by portfolio models AND Dagster metadata
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: portfolio_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d   # creates dagster_db on first boot      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # dbt — run manually / triggered by Dagster; exits after each run
  # ---------------------------------------------------------------------------
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: portfolio_dbt
    volumes:
      - ./portfolio_analytics:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy            # waits for healthcheck to pass, not just container start
    env_file:
      - .env
    command: build --profiles-dir /usr/app/dbt  # default dbt command; override per need

  # ---------------------------------------------------------------------------
  # Dagster — webserver (UI) and daemon (schedules/sensors) share one image
  # ---------------------------------------------------------------------------
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: portfolio_dagster_webserver
    restart: unless-stopped
    entrypoint: dagster-webserver
    command: -h 0.0.0.0 -p 3000 -w /usr/app/dagster/workspace.yaml
    ports:
      - "3000:3000"
    volumes:
      - ./dagster_orchestration:/usr/app/dagster                                      # live code
      - dagster_home:/opt/dagster/dagster_home                                        # run history
      - ./dagster_home/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml            # instance config
    env_file:
      - .env
    environment:
      - DAGSTER_HOME
    depends_on:
      postgres:
        condition: service_healthy
 
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: portfolio_dagster_daemon
    restart: unless-stopped
    entrypoint: dagster-daemon
    command: run -w /usr/app/dagster/workspace.yaml
    volumes:
      - ./dagster_orchestration:/usr/app/dagster                                      # live code
      - dagster_home:/opt/dagster/dagster_home                                        # shared with webserver
      - ./dagster_home/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml            # instance config
      - ./portfolio_analytics:/usr/app/dbt                                            # dbt access
    env_file:
      - .env
    environment:
      - DAGSTER_HOME
      - DBT_PROJECT_DIR=/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Superset — BI layer
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: portfolio_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./superset_home:/app/superset_home
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dagster_home:
services:
  postgres:
    image: postgres:18
    container_name: portfolio_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: portfolio_dbt
    volumes:
      - ./portfolio_analytics:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy            # waits for healthcheck to pass, not just container start
    env_file:
      - .env
    command: run                             # default dbt command; override per need

volumes:
  postgres_data: